name: Frontend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://localhost:5001/api
      VITE_SIGNALR_HUB_URL: http://localhost:5001/hubs/game

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint . && npx eslint .

      - name: Run unit tests
        run: npx vitest run

      - name: Type-check and build
        run: npm run build

      - name: Build Docker image
        run: docker build -t skycrash-frontend:ci .
