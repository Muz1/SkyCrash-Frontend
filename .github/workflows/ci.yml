name: Frontend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://localhost:5001/api
      VITE_SIGNALR_HUB_URL: http://localhost:5001/hubs/game

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint . && npx eslint .

      - name: Run unit tests
        run: npx vitest run

      - name: Type-check and build
        run: npm run build

      - name: Build Docker image
        run: docker build -t skycrash-frontend:ci .

  e2e:
    name: Playwright (layout & interactions)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The device projects use Chromium (Android presets) and WebKit (iPhone/iPad presets).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # No backend needed: every API call and the SignalR hub are answered from e2e/fixtures.
      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
